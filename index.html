<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flight Tracker Alert</title>
    <!-- Load Leaflet CSS for the interactive map background -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #f0f0f0; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .overlay-card {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: white; padding: 30px;
            border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 10;
            text-align: center; transition: all 0.3s ease;
        }
        .subtitle { color: #8e8e93; font-size: 14px; margin-bottom: 8px; font-weight: 500; }
        .title { color: #000000; font-size: 24px; font-weight: 700; margin-bottom: 24px; }
        .btn-container { display: flex; gap: 15px; justify-content: center; align-items: center; }
        
        .btn-yes {
            background: #ff2d55; color: white; border: none; padding: 14px 24px;
            font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer;
            flex: 1; transition: transform 0.2s ease; text-decoration: none; display: inline-block;
        }
        .btn-no {
            background: #f2f2f7; color: #1c1c1e; border: none; padding: 14px 24px;
            font-size: 16px; font-weight: 500; border-radius: 12px; cursor: pointer; flex: 1;
        }
        .success-title { color: #ff2d55; font-size: 26px; font-weight: bold; margin-bottom: 12px; }
        .emoji-line { font-size: 36px; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- Background Map -->
    <div id="map"></div>

    <!-- UI Overlay Card -->
    <div class="overlay-card" id="proposalCard">
        <div id="interactiveState">
            <div class="subtitle">A flight tracking alert just popped up... ✈️</div>
            <div class="title">Will you be my piggy? 🥹🐷</div>
            <div class="btn-container">
                <button class="btn-yes" id="yesBtn" onclick="acceptProposal()">Yes! 🥰</button>
                <button class="btn-no" id="noBtn" onclick="growYesButton()">No 🏃‍♀️</button>
            </div>
        </div>
        <div id="successState" style="display: none;">
            <div class="success-title">🎉 Safe Landing! 🎉</div>
            <div class="title" style="font-size: 18px; font-weight: normal;">Yay! Best flight companion ever! 🐷❤️</div>
            <div class="emoji-line">🐷❤️✈️</div>
        </div>
    </div>

    <!-- Map Logic Script -->
    <script src="https://unpkg.com"></script>
    <script>
        // Setup Map centered over a romantic coordinate
        const map = L.map('map', { zoomControl: false }).setView([39.8283, -98.5795], 4);
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png').addTo(map);

        // Custom Heart Marker for Destination
        const heartIcon = L.divIcon({
            html: '❤️', className: 'custom-heart', iconSize: [30, 30], iconAnchor: [15, 15]
        });
        L.marker([39.8283, -98.5795], { icon: heartIcon }).addTo(map);

        let currentScale = 1.0;

        function growYesButton() {
            currentScale += 0.4;
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.style.transform = `scale(${currentScale})`;
        }

        function acceptProposal() {
            document.getElementById('interactiveState').style.display = 'none';
            document.getElementById('successState').style.display = 'block';
        }
    </script>
</body>
</html>
